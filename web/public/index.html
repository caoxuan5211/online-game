<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Elastic Duo 是一个双人联机躲避游戏，玩家由弹力带连接并在颜色区域倒计时中配合移动。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/background.png" as="image" />
    <link rel="preload" href="/socket.io/socket.io.js" as="script" />
    <link rel="modulepreload" href="./src/main.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/input.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/prediction.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/smoothing.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/render.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/render-cache.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/render-quality.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/render-utils.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/settings.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/ui.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/audio.js?v=20260613-smooth10" />
    <link rel="modulepreload" href="./src/preload.js?v=20260613-smooth10" />
    <title>Elastic Duo</title>
    <link rel="stylesheet" href="./styles.css?v=20260613-smooth10" />
    <link rel="stylesheet" href="./loader.css?v=20260613-smooth10" />
    <link rel="stylesheet" href="./feedback.css?v=20260613-smooth10" />
  </head>
  <body>
    <section id="loaderPanel" class="loader-panel" aria-live="polite">
      <div class="loader-box">
        <strong>加载游戏资源</strong>
        <div class="loader-track"><span id="loaderBar"></span></div>
        <small id="loaderText">0% · 准备资源</small>
      </div>
    </section>

    <main id="appRoot" class="app-root menu-mode">
      <div class="scene-bg" aria-hidden="true"></div>
      <div class="left-overlay" aria-hidden="true"></div>

      <section class="player-card" aria-label="玩家信息">
        <div class="avatar">P</div>
        <div>
          <strong id="profileName">Player</strong>
          <span id="profileRoom">ROOM1</span>
        </div>
      </section>

      <button id="settingsButton" class="top-settings" aria-label="设置"><span aria-hidden="true">⚙</span></button>

      <section id="heroPanel" class="hero-panel" aria-label="主菜单">
        <h1><span>ELASTIC</span><span>DUO</span></h1>
        <nav class="main-menu" aria-label="游戏菜单">
          <button id="startButton" class="start-button">
            <span class="start-orb" aria-hidden="true"></span>
            <span class="button-copy"><strong>开始游戏</strong><small>START</small></span>
            <span class="arrow-circle" aria-hidden="true">→</span>
          </button>
          <button id="menuSettingsButton" class="menu-link">
            <span class="line-icon" aria-hidden="true">◎</span>
            <span><strong>设置</strong><small>SETTINGS</small></span>
          </button>
          <button id="helpButton" class="menu-link">
            <span class="line-icon" aria-hidden="true">?</span>
            <span><strong>帮助</strong><small>HELP</small></span>
          </button>
        </nav>
      </section>

      <section id="joinPanel" class="room-panel hidden" aria-label="房间匹配">
        <div class="panel-head">
          <strong>选择房间</strong>
          <button id="closeJoinButton" class="circle-button" aria-label="关闭房间面板">×</button>
        </div>
        <div id="roomList" class="room-list"></div>
        <div id="joinError" class="profile-error" aria-live="polite"></div>
        <button id="createRoomButton" class="join-button">创建房间</button>
      </section>

      <section id="lobbyPanel" class="lobby-panel hidden" aria-label="等待大厅">
        <div class="panel-head">
          <strong>等待大厅</strong>
          <button id="backHomeButton" class="circle-button" aria-label="返回主页面">&#8962;</button>
        </div>
        <div class="rule-tip">保持弹性连线，避开障碍；颜色区域闪烁时，回到自己颜色对应的区域。</div>
        <div class="lobby-grid">
          <label>昵称 <input id="nameInput" maxlength="16" value="Player" /></label>
          <div>
            <span class="field-label">颜色</span>
            <div class="color-swatches">
              <button class="active" data-player-color="#4f68ff" style="--swatch:#4f68ff"></button>
              <button data-player-color="#f05a52" style="--swatch:#f05a52"></button>
              <button data-player-color="#36c6a7" style="--swatch:#36c6a7"></button>
              <button data-player-color="#f0c766" style="--swatch:#f0c766"></button>
              <button data-player-color="#c56bff" style="--swatch:#c56bff"></button>
              <input id="customColorInput" type="color" value="#4f68ff" aria-label="自定义颜色" />
            </div>
          </div>
        </div>
        <div class="lobby-actions">
          <button id="saveProfileButton" class="save-button">保存角色</button>
          <button id="copyRoomButton" class="save-button">复制房间号</button>
        </div>
        <div id="profileError" class="profile-error" aria-live="polite"></div>
        <div id="lobbyPlayers" class="lobby-players"></div>
        <button id="readyButton" class="ready-button" disabled>准备</button>
      </section>

      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div id="countdownOverlay" class="countdown-overlay hidden" aria-live="polite">
        <span id="countdownNumber">3</span>
      </div>

      <section class="game-hud">
        <button id="backGameButton" class="circle-button" aria-label="返回主页面">&#8962;</button>
        <span id="timerText">0s</span>
        <span id="challengeText"></span>
      </section>

      <section class="game-controls">
        <button id="restartButton" disabled>重开</button>
        <span id="playerText">未加入</span>
      </section>

      <section id="resultPanel" class="result-panel hidden" aria-label="失败复盘">
        <strong>失败</strong>
        <span id="resultReason">碰撞失败</span>
        <small id="resultStats">0s · 标准</small>
        <div>
          <button id="resultRestartButton">重开</button>
          <button id="resultLobbyButton">返回大厅</button>
        </div>
      </section>

      <div id="joystick" class="joystick" aria-label="移动摇杆">
        <div id="stick" class="stick"></div>
      </div>

      <section class="connection-status" aria-label="连接状态">
        <span class="spinner" aria-hidden="true"></span>
        <span><strong id="statusText">连接中...</strong><small>CONNECTING...</small></span>
      </section>

      <aside id="settingsPanel" class="settings-panel" aria-label="游戏设置">
        <div class="settings-head">
          <strong>设置</strong>
          <button id="closeSettingsButton" class="circle-button" aria-label="关闭设置">×</button>
        </div>
        <label>难度 <span id="difficultyValue" class="range-value">5</span>
          <input id="difficultySelect" type="range" min="1" max="10" step="1" value="5" />
          <small id="difficultyHint" class="settings-hint">房主可调整，数值越高障碍越密、越快，区域判定时间越短。</small>
        </label>
        <label>画质
          <select id="qualitySelect">
            <option value="high">高</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="toggle-row"><input id="backgroundToggle" type="checkbox" />显示场景背景</label>
        <label class="toggle-row"><input id="shakeToggle" type="checkbox" />屏幕震动</label>
        <label class="toggle-row"><input id="soundToggle" type="checkbox" />交互音效</label>
        <label class="toggle-row"><input id="musicToggle" type="checkbox" />背景音乐</label>
        <label>音量 <span id="volumeValue" class="range-value">85</span>
          <input id="volumeSelect" type="range" min="0" max="100" step="1" value="85" />
        </label>
      </aside>

      <aside id="helpPanel" class="help-panel" aria-label="帮助">
        <div class="settings-head">
          <strong>帮助</strong>
          <button id="closeHelpButton" class="circle-button" aria-label="关闭帮助">×</button>
        </div>
        <p>创建或加入房间，在等待大厅调整昵称和颜色。两人准备后开始，用 WASD 或方向键移动。</p>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./config.js?v=20260613-smooth10"></script>
    <script type="module" src="./src/main.js?v=20260613-smooth10"></script>
  </body>
</html>
