<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Elastic Duo 是一个双人联机躲避游戏，玩家由弹力带连接并在颜色区域倒计时中配合移动。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Elastic Duo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="appRoot" class="app-root menu-mode">
      <div class="scene-bg" aria-hidden="true"></div>
      <div class="left-overlay" aria-hidden="true"></div>

      <section class="player-card" aria-label="玩家信息">
        <div class="avatar">P</div>
        <div>
          <strong id="profileName">Player</strong>
          <span id="profileRoom">ROOM1</span>
        </div>
      </section>

      <button id="settingsButton" class="top-settings" aria-label="设置">
        <span aria-hidden="true">⚙</span>
      </button>

      <section id="heroPanel" class="hero-panel" aria-label="主菜单">
        <h1>ELASTIC<br />DUO</h1>
        <p>弹性之间，连接彼此</p>

        <nav class="main-menu" aria-label="游戏菜单">
          <button id="startButton" class="start-button">
            <span class="start-orb" aria-hidden="true"></span>
            <span class="button-copy">
              <strong>开始游戏</strong>
              <small>START</small>
            </span>
            <span class="arrow-circle" aria-hidden="true">→</span>
          </button>

          <button id="menuSettingsButton" class="menu-link">
            <span class="line-icon" aria-hidden="true">◎</span>
            <span>
              <strong>设置</strong>
              <small>SETTINGS</small>
            </span>
          </button>

          <button id="helpButton" class="menu-link">
            <span class="line-icon" aria-hidden="true">?</span>
            <span>
              <strong>帮助</strong>
              <small>HELP</small>
            </span>
          </button>
        </nav>
      </section>

      <section id="joinPanel" class="room-panel hidden" aria-label="房间设置">
        <div class="panel-head">
          <strong>进入房间</strong>
          <button id="closeJoinButton" class="circle-button" aria-label="关闭房间面板">×</button>
        </div>
        <label>
          昵称
          <input id="nameInput" maxlength="16" value="Player" />
        </label>
        <label>
          房间
          <input id="roomInput" maxlength="24" value="room1" />
        </label>
        <div class="segmented">
          <button id="redButton" class="active" data-color="red">红队</button>
          <button id="blueButton" data-color="blue">蓝队</button>
        </div>
        <button id="joinButton" class="join-button">进入房间</button>
      </section>

      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <section class="game-hud">
        <span id="timerText">0s</span>
        <span id="challengeText"></span>
      </section>

      <section class="game-controls">
        <button id="readyButton" class="ready-button" disabled>准备</button>
        <button id="restartButton" disabled>重开</button>
        <span id="playerText">未加入</span>
      </section>

      <section class="connection-status" aria-label="连接状态">
        <span class="spinner" aria-hidden="true"></span>
        <span>
          <strong id="statusText">连接中...</strong>
          <small>CONNECTING...</small>
        </span>
      </section>

      <aside id="settingsPanel" class="settings-panel" aria-label="游戏设置">
        <div class="settings-head">
          <strong>设置</strong>
          <button id="closeSettingsButton" class="circle-button" aria-label="关闭设置">×</button>
        </div>
        <label>
          难度
          <select id="difficultySelect">
            <option value="easy">轻松</option>
            <option value="normal">标准</option>
            <option value="hard">高压</option>
          </select>
        </label>
        <label>
          画质
          <select id="qualitySelect">
            <option value="high">高</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="toggle-row">
          <input id="backgroundToggle" type="checkbox" />
          显示场景背景
        </label>
        <label class="toggle-row">
          <input id="shakeToggle" type="checkbox" />
          屏幕震动
        </label>
      </aside>

      <aside id="helpPanel" class="help-panel" aria-label="帮助">
        <div class="settings-head">
          <strong>帮助</strong>
          <button id="closeHelpButton" class="circle-button" aria-label="关闭帮助">×</button>
        </div>
        <p>两名玩家进入同一房间后准备开始。使用 WASD 或方向键移动，避开障碍，并在颜色区域闪烁时回到对应区域。</p>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./config.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
